  name: curapaste

  services:
    postgres:
      image: postgres:16
      container_name: curapaste-postgres
      restart: unless-stopped

      environment:
        POSTGRES_DB: pastebin
        POSTGRES_USER: pastebin
        POSTGRES_PASSWORD: pastebin

      ports:
        - "5432:5432"

      volumes:
        - postgres_data:/var/lib/postgresql/data

      networks:
        - curapaste-network

      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U pastebin -d pastebin"]
        interval: 10s
        timeout: 5s
        retries: 5

    pgadmin:
      image: dpage/pgadmin4:latest
      container_name: curapaste-pgadmin
      restart: unless-stopped

      environment:
        PGADMIN_DEFAULT_EMAIL: admin@curapaste.com
        PGADMIN_DEFAULT_PASSWORD: admin123

      ports:
        - "5050:80"

      volumes:
        - pgadmin_data:/var/lib/pgadmin

      depends_on:
        postgres:
          condition: service_healthy

      networks:
        - curapaste-network

    minio:
      image: minio/minio:latest
      container_name: curapaste-minio
      restart: unless-stopped

      command: server /data --console-address ":9001"

      environment:
        MINIO_ROOT_USER: minio
        MINIO_ROOT_PASSWORD: minio123

      ports:
        - "9000:9000" # S3 API
        - "9001:9001" # Web Console

      volumes:
        - minio_data:/data

      networks:
        - curapaste-network

      healthcheck:
        test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
        interval: 30s
        timeout: 20s
        retries: 3

  volumes:
    postgres_data:
    minio_data:
    pgadmin_data:

  networks:
    curapaste-network:
      driver: bridge