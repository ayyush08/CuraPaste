spring:
  application:
    name: curapaste
  datasource:
    url: jdbc:postgresql://localhost:5432/pastebin
    username: pastebin
    password: pastebin
  jpa:
    hibernate:
        ddl-auto: validate
  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 2s #for circuit breaker to gracefully open when redis is down
      timeout: 2s
  flyway:
    baseline-on-migrate: true
    baseline-version: 4
  rabbitmq:
    host: localhost
    port: 5672
    username: curapaste
    password: curapaste
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-retries: 3
        default-requeue-rejected: false # after retries exhaust, route to DLQ instead of looping forever
storage:
  endpoint: http://localhost:9000
  access-key: minio
  secret-key: minio123
  bucket: curapaste-content
  region: us-east-1
  inline-threshold-bytes:  50 # less for testing, (use 51200 (50kb) for prod)


cleanup:
  expiry:
    interval-ms: 300000 # (5min) -  15seconds(1500) for testing locally could be good
    batch-size: 500

rabbitmq:
  exchange: paste.events
  dead-letter-exchange: paste.events.dlx
  abuse-scan-queue: paste.abuse-scan
  dead-letter-queue: paste.events.dlq


resilience4j:
  circuitbreaker:
    instances:
      redisCache:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s

      objectStorage:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

  retry:
    instances:
      objectStorage:
        maxAttempts: 3
        waitDuration: 200ms
        exponentialBackoffMultiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus